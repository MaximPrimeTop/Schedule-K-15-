<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060405">
<title>Розклад занять</title>

<!-- Golos Text — основний шрифт (як в оригіналі).
     Rubik Wet Paint — єдиний доданий шрифт: «стікаючі» літери з кирилицею, лише для назви дня. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   0. ТОКЕНИ ДИЗАЙНУ — «Spooky Halloween»
   Усі кольори, прозорості та SVG-іконки декору змінюються тут.
   ========================================================================= */
:root{
  /* --- фон --- */
  --bg: #060405;                          /* майже чорний */
  --bg-glow-1: #3A0A0E;                   /* криваво-червоне світіння */
  --bg-glow-2: #3B1806;                   /* жарине, помаранчеве */
  --fog-color: rgba(200,180,175,0.06);    /* туман */
  --noise-opacity: .06;                   /* плівкове зерно */

  /* --- картки: темне матове скло (щоб декор не заважав читати) --- */
  --card-bg: rgba(18,10,11,0.62);
  --card-bg-strong: rgba(30,16,16,0.75);
  --card-border: rgba(255,120,60,0.14);
  --card-glow: rgba(255,80,20,0.28);
  --divider: rgba(255,220,200,0.08);

  /* --- текст --- */
  --text: #F5ECE6;
  --text-dim: #C2B1A6;
  --text-faint: #8F7E73;

  /* --- акценти --- */
  --accent: #FF7A1A;                      /* гарбуз */
  --accent-soft: rgba(255,122,26,0.13);
  --accent-soft-strong: rgba(255,122,26,0.24);
  --accent-border: rgba(255,122,26,0.45);
  --candle: rgba(255,150,40,0.55);        /* світло свічки для поточної пари */
  --blood: #8E1520;                       /* краплі під заголовком */
  --badge-text: #1A0700;

  --popup-bg: #170D0E;

  --zoom-dot: #8DB6FF;
  --meet-dot: #86E8B4;

  /* --- декор --- */
  --moon-light: #F7C68C;
  --moon-dark: #B9531F;
  --moon-opacity: .38;
  --web-color: rgba(235,220,210,0.16);
  --spider-color: #1C1112;
  --bat-color: #0B0607;
  --eye-color: #FF5A1F;
  --eye-core: #FFD27A;

  /* --- SVG-іконки (працюють як маска: колір задається через background) --- */
  --icon-jack: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill-rule='evenodd' d='M12 7c-5 0-9 3-9 7s4 7 9 7 9-3 9-7-4-7-9-7zM7.5 12.6l2-2.6 1 2.6zM16.5 12.6l-2-2.6-1 2.6zM7 15.4c1.6 2.6 8.4 2.6 10 0-.9.4-1.7.5-2.5.5l-.8 1-.9-1h-1.6l-.9 1-.8-1c-.8 0-1.6-.1-2.5-.5zM11.2 7V5.2c0-1.1.8-2 2.2-2.4l.5 1.1c-.8.3-1.2.8-1.2 1.4V7z'/></svg>");
  --icon-drips: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 14' preserveAspectRatio='none'><path d='M0 0h120v1.5c-6 0-7 1-7 4 0 2-1 3-2 3s-2-1-2-3c0-3-1-4-9-4H62c-3 0-4 1-4 6 0 3-1 5-2.5 5S53 10.5 53 7.5c0-5-1-6-5-6H24c-3 0-4 1-4 3 0 1.5-.8 2.5-1.8 2.5S16.4 6 16.4 4.5c0-2-1-3-4-3H0z'/></svg>");
  --icon-web: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='black' stroke-width='1'><path d='M0 0L100 0M0 0L92.4 38.3M0 0L70.7 70.7M0 0L38.3 92.4M0 0L0 100'/><path d='M12 0Q9.8 2 11.1 4.6Q8.3 5.6 8.5 8.5Q5.6 8.3 4.6 11.1Q2 9.8 0 12'/><path d='M30 0Q24.5 4.9 27.7 11.5Q20.8 13.9 21.2 21.2Q13.9 20.8 11.5 27.7Q4.9 24.5 0 30'/><path d='M55 0Q45.1 9 50.8 21Q38.2 25.6 38.9 38.9Q25.6 38.2 21 50.8Q9 45.1 0 55'/><path d='M80 0Q65.7 13.1 73.9 30.6Q55.7 37.3 56.6 56.6Q37.3 55.7 30.6 73.9Q13.1 65.7 0 80'/></svg>");
  --icon-spider: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black' stroke='black' stroke-width='1.3' stroke-linecap='round'><ellipse cx='12' cy='13' rx='3' ry='3.6'/><circle cx='12' cy='8.6' r='2'/><path fill='none' d='M9.5 11L5 7.5 3 9M9.2 13H4l-2 2M9.5 15l-4 3-1 3M14.5 11L19 7.5l2 1.5M14.8 13H20l2 2M14.5 15l4 3 1 3'/></svg>");
  --icon-bat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 8c.6 0 1-.6 1.2-1.4l.6 1.4c2-.2 3.6-1.4 4.4-3 .4 1.8 2 3.2 4.3 3.4-1.6.8-2.6 2.4-2.6 4.2-1.2-1-3-1.2-4.4-.4-.8.5-1.4 1.4-1.6 2.4-.4-.8-1.1-1.3-1.9-1.3s-1.5.5-1.9 1.3c-.2-1-.8-1.9-1.6-2.4-1.4-.8-3.2-.6-4.4.4 0-1.8-1-3.4-2.6-4.2 2.3-.2 3.9-1.6 4.3-3.4.8 1.6 2.4 2.8 4.4 3l.6-1.4C11 7.4 11.4 8 12 8z'/></svg>");
  --noise: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");

  --radius-lg: 26px;
  --radius-md: 16px;
  --radius-sm: 10px;

  --ease: cubic-bezier(.22,.9,.32,1);
  --font: 'Golos Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-display: 'Rubik Wet Paint', var(--font);
}

/* =========================================================================
   1. RESET / БАЗА
   ========================================================================= */
*, *::before, *::after{ box-sizing:border-box; }
html, body{ height:100%; }
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{ font-family:inherit; }
a{ color:inherit; }

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
  border-radius:4px;
}

/* Без анімацій для тих, хто їх вимкнув (включно з декором у псевдоелементах) */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ transition:none !important; animation:none !important; }
}

/* =========================================================================
   2. СЦЕНА: фон, світіння, віньєтка
   ========================================================================= */
.scene{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
.scene__glow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(520px 360px at 15% 25%, var(--bg-glow-1), transparent 60%),
    radial-gradient(700px 360px at 60% 105%, var(--bg-glow-2), transparent 65%);
  opacity:.8;
  filter:blur(10px);
}
/* Темні краї: по боках (приглушення бічних карток) + кругова віньєтка */
.scene__vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;
  background:
    linear-gradient(to right, var(--bg) 0%, transparent 14%, transparent 86%, var(--bg) 100%),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
}

/* =========================================================================
   3. ДЕКОР (усе з pointer-events:none — кліки та свайпи не перехоплює)
   ========================================================================= */
.scene__decor{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

/* --- плівкове зерно --- */
.noise{
  position:absolute;
  inset:0;
  background:var(--noise);
  opacity:var(--noise-opacity);
}

/* --- тьмяний «кривавий» місяць --- */
.moon{
  position:absolute;
  top:7%;
  right:9%;
  width:130px;
  height:130px;
  border-radius:50%;
  background:radial-gradient(circle at 38% 35%, var(--moon-light), var(--moon-dark) 75%);
  opacity:var(--moon-opacity);
  box-shadow:0 0 80px 20px rgba(255,110,40,.12);
}

/* --- кажани біля місяця (махають крилами) --- */
.bat{
  position:absolute;
  width:var(--s, 26px);
  height:var(--s, 26px);
  background:var(--bat-color);
  -webkit-mask:var(--icon-bat) center/contain no-repeat;
          mask:var(--icon-bat) center/contain no-repeat;
  animation:batFlap 2.4s ease-in-out infinite;
}
.bat--1{ --s:30px; top:calc(7% + 40px); right:calc(9% + 50px); }
.bat--2{ --s:18px; top:calc(7% + 18px); right:calc(9% + 16px); animation-delay:-1.1s; }
@keyframes batFlap{
  0%, 100%{ transform:translateY(0) scaleY(1); }
  50%     { transform:translateY(-7px) scaleY(.7); }
}

/* --- павутиння в кутах --- */
.web{
  position:absolute;
  top:0;
  width:170px;
  height:170px;
  background:var(--web-color);
  -webkit-mask:var(--icon-web) top left/contain no-repeat;
          mask:var(--icon-web) top left/contain no-repeat;
}
.web--tl{ left:0; }
.web--tr{ right:0; transform:scaleX(-1); }

/* --- павук на павутинці, що повільно гойдається --- */
.spider{
  position:absolute;
  top:-40px;
  left:16%;
  width:1px;
  height:var(--thread, 26vh);
  background:linear-gradient(rgba(235,220,210,.05), rgba(235,220,210,.28));
  transform-origin:top center;
  filter:drop-shadow(0 0 6px rgba(255,90,30,.35));
  animation:spiderBob 7s ease-in-out infinite alternate;
}
.spider::after{
  content:"";
  position:absolute;
  bottom:-20px;
  left:50%;
  width:24px;
  height:24px;
  margin-left:-12px;
  background:var(--spider-color);
  -webkit-mask:var(--icon-spider) center/contain no-repeat;
          mask:var(--icon-spider) center/contain no-repeat;
}
@keyframes spiderBob{
  from{ transform:translateY(0) rotate(2deg); }
  to  { transform:translateY(34px) rotate(-2deg); }
}

/* --- очі в темряві: з'являються, кліпають, зникають --- */
.eyes{
  position:absolute;
  display:flex;
  gap:var(--gap, 9px);
  opacity:.7;                                     /* значення при вимкнених анімаціях */
  animation:eyesFade 16s ease-in-out infinite;
}
.eyes::before, .eyes::after{
  content:"";
  width:var(--w, 10px);
  height:calc(var(--w, 10px) * .55);
  border-radius:50%;
  background:radial-gradient(circle, var(--eye-core) 0 25%, var(--eye-color) 55%, transparent 75%);
  box-shadow:0 0 12px 2px rgba(255,90,30,.35);
  transform:rotate(var(--tilt));
  animation:blink 5s ease-in-out infinite;
}
.eyes::before{ --tilt:14deg; }                   /* «зла» посадка очей */
.eyes::after { --tilt:-14deg; }
.eyes--1{ --w:10px; top:58%; left:6%; }
.eyes--2{ --w:7px; --gap:6px; top:30%; right:5%; animation-delay:-6s; }
.eyes--3{ --w:8px; --gap:7px; bottom:9%; right:24%; animation-delay:-11s; }
@keyframes eyesFade{
  0%, 100%{ opacity:0; }
  15%, 60%{ opacity:.85; }
  75%     { opacity:0; }
}
@keyframes blink{
  0%, 88%, 100%{ transform:rotate(var(--tilt)) scaleY(1); }
  92%          { transform:rotate(var(--tilt)) scaleY(.1); }
}

/* --- туман, що повзе --- */
.fog{
  position:absolute;
  inset:-15%;
  will-change:transform;
}
.fog--1{
  background:
    radial-gradient(40% 22% at 25% 75%, var(--fog-color), transparent 70%),
    radial-gradient(35% 18% at 75% 40%, var(--fog-color), transparent 70%);
  animation:fogDrift 42s ease-in-out infinite alternate;
}
.fog--2{
  background:
    radial-gradient(45% 20% at 60% 88%, var(--fog-color), transparent 70%),
    radial-gradient(30% 16% at 12% 30%, var(--fog-color), transparent 70%);
  animation:fogDrift 58s ease-in-out infinite alternate-reverse;
}
.fog--ground{
  position:absolute;
  left:0; right:0; bottom:0;
  height:30%;
  background:linear-gradient(to top, rgba(190,160,150,.09), transparent);
}
@keyframes fogDrift{
  from{ transform:translate3d(-5%, 0, 0); }
  to  { transform:translate3d(5%, -2%, 0); }
}

/* =========================================================================
   4. КАРУСЕЛЬ
   ========================================================================= */
.carousel{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  width:100%;
  max-width:1100px;
}

.nav-btn{
  display:none;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:50%;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--text-dim);
  cursor:pointer;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease);
}
.nav-btn:hover{ color:var(--accent); background:var(--card-bg-strong); }
.nav-btn:active{ transform:scale(.92); }
.nav-btn svg{ width:18px; height:18px; }

.cards{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  transition:opacity .22s var(--ease), transform .22s var(--ease);
}
.cards.is-leaving-next{ opacity:0; transform:translateX(-14px); }
.cards.is-leaving-prev{ opacity:0; transform:translateX(14px); }

/* =========================================================================
   5. КАРТКА ДНЯ
   ========================================================================= */
.day-card{
  border-radius:var(--radius-lg);
  border:1px solid var(--card-border);
  background:var(--card-bg);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    0 24px 60px -20px rgba(0,0,0,.8),
    0 0 60px -26px var(--card-glow),
    inset 0 1px 0 rgba(255,200,170,.05);
  padding:30px 26px;
}

.day-card--center{
  width:min(430px, 100%);
  flex-shrink:0;
}

.day-card--side{
  width:250px;
  flex-shrink:0;
  transform:scale(.86);
  opacity:.35;
  filter:blur(1.5px);
  cursor:pointer;
  border:none;
  text-align:left;
  color:var(--text);
  transition:opacity .2s var(--ease), filter .2s var(--ease), transform .2s var(--ease);
}
.day-card--side:hover{ opacity:.6; filter:blur(0); }
.day-card--side .teacher__icon{ pointer-events:none; }

/* Шапка: замість лінії — смуга з краплями «крові» */
.day-card__header{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:24px;
  padding-bottom:16px;
}
.day-card__header::after{
  content:"";
  position:absolute;
  left:0; right:0;
  bottom:-12px;
  height:13px;
  background:var(--blood);
  opacity:.75;
  -webkit-mask:var(--icon-drips) 0 0/100% 100% no-repeat;
          mask:var(--icon-drips) 0 0/100% 100% no-repeat;
}

/* Назва дня: «стікаючий» шрифт + гарбуз-ліхтар */
.day-card__weekday{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:var(--font-display);
  font-size:23px;
  font-weight:400;
  letter-spacing:.02em;
  color:var(--accent);
  text-shadow:0 0 14px rgba(255,100,20,.45);
}
.day-card__weekday::before{
  content:"";
  width:22px;
  height:22px;
  flex-shrink:0;
  background:var(--accent);
  -webkit-mask:var(--icon-jack) center/contain no-repeat;
          mask:var(--icon-jack) center/contain no-repeat;
  filter:drop-shadow(0 0 6px var(--candle));
}
.day-card__date{ font-size:14px; color:var(--text-faint); white-space:nowrap; }

.day-card__banner{
  font-size:13px;
  color:var(--text-dim);
  background:var(--accent-soft);
  border:1px solid var(--card-border);
  border-radius:var(--radius-sm);
  padding:10px 14px;
  margin-bottom:16px;
}

/* ---- порожній стан (неділя / немає даних) ---- */
.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:12px;
  padding:26px 6px 6px;
  color:var(--text-dim);
}
.empty-state svg{
  width:36px; height:36px;
  color:var(--accent);
  filter:drop-shadow(0 0 8px var(--candle));
  animation:candle 3.4s ease-in-out infinite;
}
.empty-state__title{ font-size:15px; color:var(--text); font-weight:600; }
.empty-state__hint{ font-size:13px; color:var(--text-faint); }

/* =========================================================================
   6. ПАРА
   ========================================================================= */
.pairs{ display:flex; flex-direction:column; }

.pair{
  padding:16px 4px 16px 14px;
  border-top:1px solid var(--divider);
  border-left:3px solid transparent;
  transition:opacity .25s var(--ease);
}
.pair:first-child{ border-top:none; padding-top:2px; }

/* Минулі пари: «вицвілі» — прозорі й без кольору */
.pair--past{ opacity:.35; filter:grayscale(1); }
.pair--past .pair__subject{ color:var(--text-dim); }

/* Поточна пара: світло свічки з легким мерехтінням */
.pair--current{
  border-left-color:var(--accent);
  background:linear-gradient(90deg, rgba(255,122,26,.17), rgba(255,122,26,.04));
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  box-shadow:0 0 24px -6px var(--candle);
  animation:candle 3.4s ease-in-out infinite;
}
.pair--current:first-child{ padding-top:14px; }
.pair--current .pair__meta{ color:var(--text-dim); }

@keyframes candle{
  0%, 100%{ box-shadow:0 0 22px -6px var(--candle); }
  20%     { box-shadow:0 0 28px -3px var(--candle); }
  35%     { box-shadow:0 0 18px -8px var(--candle); }
  60%     { box-shadow:0 0 26px -4px var(--candle); }
  80%     { box-shadow:0 0 20px -7px var(--candle); }
}

.pair__meta{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12.5px;
  color:var(--text-faint);
  margin-bottom:6px;
}
.pair__badge{
  font-size:11px;
  font-weight:700;
  color:var(--badge-text);
  background:var(--accent);
  padding:2px 8px;
  border-radius:999px;
  box-shadow:0 0 10px rgba(255,122,26,.5);
}

.pair__subject{
  font-size:16.5px;
  font-weight:600;
  line-height:1.3;
  margin-bottom:3px;
}
.pair__room{
  font-size:13px;
  color:var(--text-faint);
  margin-bottom:10px;
}

.pair__teachers{
  display:flex;
  justify-content:center;
  gap:14px;
}
.pair__teachers--split{ justify-content:space-between; }
.pair__divider{
  width:1px;
  align-self:stretch;
  background:var(--divider);
  flex-shrink:0;
}

.teacher{
  position:relative;
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}
.pair__teachers--split .teacher{ flex:1 1 0; }
.pair__teachers--split .teacher:last-child{ justify-content:flex-end; }

.teacher__name{
  font-size:13.5px;
  color:var(--text-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.teacher__icon{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  width:22px;
  height:22px;
  border-radius:50%;
  border:1px solid var(--card-border);
  background:rgba(255,200,170,.03);
  color:var(--text-dim);
  cursor:pointer;
  transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.teacher__icon svg{ width:12px; height:12px; }
.teacher__icon--zoom:hover, .teacher__icon--zoom.is-open{ color:var(--zoom-dot); border-color:var(--zoom-dot); }
.teacher__icon--meet:hover, .teacher__icon--meet.is-open{ color:var(--meet-dot); border-color:var(--meet-dot); }

/* ---- попап ---- */
.popup{
  display:none;
  position:absolute;
  top:calc(100% + 9px);
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  min-width:150px;
  max-width:210px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  background:var(--popup-bg);
  border:1px solid var(--card-border);
  box-shadow:0 16px 34px -12px rgba(0,0,0,.8);
  text-align:center;
}
.teacher__icon.is-open + .popup{ display:block; }
@media (hover:hover) and (pointer:fine){
  .teacher__icon:hover + .popup{ display:block; }
}
.popup__link{
  display:inline-block;
  font-size:13px;
  font-weight:600;
  color:var(--accent);
  text-decoration:none;
}
.popup__link:hover{ text-decoration:underline; }
.popup__note{
  margin:0;
  font-size:12.5px;
  color:var(--text-dim);
  line-height:1.4;
}
.popup__note--empty{ color:var(--text-faint); }

/* =========================================================================
   7. СТАН ЗАВАНТАЖЕННЯ / ПОМИЛКИ
   ========================================================================= */
.status-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  text-align:center;
  color:var(--text-dim);
  font-size:14px;
}
.status-state__title{ font-size:16px; font-weight:600; color:var(--text); }
.retry-btn{
  margin-top:4px;
  padding:9px 18px;
  border-radius:999px;
  border:1px solid var(--accent-border);
  background:var(--accent-soft);
  color:var(--accent);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.retry-btn:hover{ background:var(--accent-soft-strong); }

.spinner{
  width:26px; height:26px;
  border-radius:50%;
  border:2px solid var(--divider);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* =========================================================================
   8. МОБІЛЬНА ВЕРСТКА (<768px) — менше декору, нічого не заважає тексту
   ========================================================================= */
@media (max-width:768px){
  .day-card--side{ display:none; }
  .day-card--center{ width:100%; padding:26px 20px; }
  .nav-btn{ display:flex; }
  .scene__vignette{ background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  .moon{ width:80px; height:80px; top:3%; right:6%; }
  .bat--1{ --s:20px; top:calc(3% + 26px); right:calc(6% + 34px); }
  .bat--2{ --s:13px; top:calc(3% + 10px); right:calc(6% + 8px); }
  .web{ width:95px; height:95px; }
  .spider{ left:22%; --thread:13vh; }
  .eyes--2{ display:none; }
  .eyes--1{ top:auto; bottom:6%; left:7%; }
}
@media (max-width:400px){
  .carousel{ gap:8px; }
  .day-card--center{ padding:24px 16px; }
  .day-card__weekday{ font-size:21px; }
}
</style>
</head>
<body>

<div class="scene">
  <div class="scene__glow"></div>

  <!-- Декоративний шар: суто візуальний, прихований від скрінрідерів -->
  <div class="scene__decor" aria-hidden="true">
    <div class="noise"></div>
    <div class="moon"></div>
    <span class="bat bat--1"></span>
    <span class="bat bat--2"></span>
    <span class="web web--tl"></span>
    <span class="web web--tr"></span>
    <span class="spider"></span>
    <span class="eyes eyes--1"></span>
    <span class="eyes eyes--2"></span>
    <span class="eyes eyes--3"></span>
    <div class="fog fog--1"></div>
    <div class="fog fog--2"></div>
    <div class="fog--ground"></div>
  </div>

  <div class="scene__vignette"></div>

  <div class="carousel">
    <button class="nav-btn nav-btn--prev" id="btnPrev" aria-label="Попередній день" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <div class="cards" id="cards">
      <button class="day-card day-card--side day-card--prev" id="cardPrev" type="button" aria-label="Попередній день"></button>
      <section class="day-card day-card--center" id="cardCenter" aria-live="polite"></section>
      <button class="day-card day-card--side day-card--next" id="cardNext" type="button" aria-label="Наступний день"></button>
    </div>

    <button class="nav-btn nav-btn--next" id="btnNext" aria-label="Наступний день" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================================
   КОНФІГ — сюди вставити посилання на опубліковану Google Таблицю
   (File → Share → Publish to web → формат CSV, посилання виду
   https://docs.google.com/spreadsheets/d/e/XXXXX/pub?output=csv)
   ========================================================================= */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbQMgs7oZwteozsbVcKGurREdfzqlQlylTpmVFL605l7wGvk4e8JHtzjwpdNMcBSwPq9Yi7mb4SVL6/pub?gid=777147651&single=true&output=csv";

// Поріг свайпу (px) та тривалість анімації перемикання дня (ms) — можна міняти
const SWIPE_THRESHOLD = 45;
const TRANSITION_MS = 220;
// Як часто перевіряти поточний час, щоб підсвітка "зараз" лишалась актуальною (ms)
const CLOCK_REFRESH_MS = 60000;

// Назви днів тижня, індекс відповідає JS getUTCDay(): 0 = неділя ... 6 = субота
const DAY_NAMES = ["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];

/* =========================================================================
   СТАН ЗАСТОСУНКУ
   ========================================================================= */
let scheduleRows = [];   // рядки з CSV
let todayUTC = null;     // "сьогодні" за Києвом, як Date на 00:00 UTC (лише для арифметики дат)
let nowMinutes = 0;      // поточний час у Києві, хвилин від півночі
let baseOffset = 0;      // зміщення центральної картки від сьогодні, у днях
let isAnimating = false;

const els = {
  cards: document.getElementById("cards"),
  cardPrev: document.getElementById("cardPrev"),
  cardCenter: document.getElementById("cardCenter"),
  cardNext: document.getElementById("cardNext"),
  btnPrev: document.getElementById("btnPrev"),
  btnNext: document.getElementById("btnNext"),
};

/* =========================================================================
   ЧАС / ДАТА (часовий пояс Europe/Kyiv, незалежно від пояса пристрою)
   ========================================================================= */
function getKyivNow(){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Kyiv",
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(new Date());
  const get = t => Number(parts.find(p => p.type === t).value);
  return { year:get("year"), month:get("month"), day:get("day"), hour:get("hour"), minute:get("minute") };
}

function refreshClock(){
  const k = getKyivNow();
  todayUTC = Date.UTC(k.year, k.month - 1, k.day);
  nowMinutes = k.hour * 60 + k.minute;
}

function addDaysUTC(baseMs, n){
  return baseMs + n * 86400000;
}

function formatDateUA(ms){
  return new Intl.DateTimeFormat("uk-UA", { day:"numeric", month:"long", timeZone:"UTC" }).format(new Date(ms));
}

function normalizeDayName(s){
  return (s || "").toLowerCase().replace(/['’ʼ]/g, "").trim();
}

function parseTimeToMinutes(str){
  if (!str) return null;
  const m = String(str).trim().match(/^(\d{1,2})[:.](\d{2})/);
  if (!m) return null;
  return Number(m[1]) * 60 + Number(m[2]);
}

/* =========================================================================
   CSV: ЗАВАНТАЖЕННЯ ТА РОЗБІР
   Простий власний парсер (без зовнішніх бібліотек) — коректно обробляє
   поля в лапках з комами/переносами рядків усередині.
   ========================================================================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;

  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ","){ row.push(field); field = ""; }
      else if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r"){ /* ігноруємо, перенос обробляється через \n */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  if (!rows.length) return [];

  const headers = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.some(v => v && v.trim() !== "")) // прибираємо повністю порожні рядки
    .map(r => {
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (r[idx] ?? "").trim(); });
      return obj;
    });
}

async function loadSchedule(){
  renderLoadingState();
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    scheduleRows = parseCSV(text).filter(r => (r["День"] || "").trim() && (r["Предмет"] || "").trim());
    refreshClock();
    renderAll();
    setInterval(() => { refreshClock(); renderAll(); }, CLOCK_REFRESH_MS);
  } catch (err){
    renderErrorState();
  }
}

/* =========================================================================
   ДАНІ ДЛЯ КОНКРЕТНОГО ДНЯ
   ========================================================================= */
function getDayInfo(offset){
  const dateMs = addDaysUTC(todayUTC, offset);
  const weekdayIdx = new Date(dateMs).getUTCDay();
  const dayName = DAY_NAMES[weekdayIdx];
  const rows = scheduleRows
    .filter(r => normalizeDayName(r["День"]) === normalizeDayName(dayName))
    .sort((a, b) => (Number(a["№ пари"]) || 0) - (Number(b["№ пари"]) || 0));
  return { dateMs, weekdayIdx, dayName, rows };
}

function computeStatus(offset, startMin, endMin){
  if (offset < 0) return "past";
  if (offset > 0) return "future";
  if (startMin === null || endMin === null) return "future";
  if (nowMinutes < startMin) return "future";
  if (nowMinutes > endMin) return "past";
  return "current";
}

/* =========================================================================
   РЕНДЕР: ІКОНКИ ПЛАТФОРМ (узагальнені, без відтворення чужих логотипів)
   ========================================================================= */
const ICON_ZOOM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="3"></rect><path d="M16 10.5l5-3v9l-5-3" stroke-linejoin="round"></path></svg>';
const ICON_MEET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="3"></rect><circle cx="18.5" cy="9.5" r="1.4" fill="currentColor" stroke="none"></circle></svg>';

function escapeHTML(str){
  return String(str)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

function teacherHTML(name, platform, link, note){
  name = (name || "").trim();
  if (!name) return "";

  const plat = (platform || "").trim().toLowerCase();
  let icon = "", iconClass = "";
  if (plat === "zoom"){ icon = ICON_ZOOM; iconClass = "teacher__icon--zoom"; }
  else if (plat === "meet"){ icon = ICON_MEET; iconClass = "teacher__icon--meet"; }

  let popup = "";
  if (icon){
    const cleanLink = (link || "").trim();
    const cleanNote = (note || "").trim();
    if (cleanLink){
      popup = `<a class="popup__link" href="${escapeHTML(cleanLink)}" target="_blank" rel="noopener">Приєднатись</a>`;
    } else if (cleanNote){
      popup = `<p class="popup__note">${escapeHTML(cleanNote)}</p>`;
    } else {
      popup = `<p class="popup__note popup__note--empty">Посилання поки немає</p>`;
    }
  }

  return `
    <div class="teacher">
      <span class="teacher__name">${escapeHTML(name)}</span>
      ${icon ? `
        <button type="button" class="teacher__icon ${iconClass}" data-popup-toggle aria-label="Посилання на пару, ${escapeHTML(name)}">${icon}</button>
        <div class="popup" role="tooltip">${popup}</div>
      ` : ""}
    </div>`;
}

function pairHTML(row, status){
  const num = (row["№ пари"] || "").trim();
  const start = (row["Час початку"] || "").trim();
  const end = (row["Час кінця"] || "").trim();
  const subject = (row["Предмет"] || "Без назви").trim();
  const room = (row["Аудиторія/формат"] || "").trim();
  const hasSecond = !!(row["Викладач_2"] || "").trim();

  const sub1 = teacherHTML(row["Викладач_1"], row["Платформа_1"], row["Силка_1"], row["Примітка_1"]);
  const sub2 = hasSecond ? teacherHTML(row["Викладач_2"], row["Платформа_2"], row["Силка_2"], row["Примітка_2"]) : "";

  return `
    <div class="pair pair--${status}">
      <div class="pair__meta">
        ${num ? `<span>${escapeHTML(num)} пара</span>` : ""}
        ${(start || end) ? `<span>${escapeHTML(start)}–${escapeHTML(end)}</span>` : ""}
        ${status === "current" ? `<span class="pair__badge">Зараз</span>` : ""}
      </div>
      <div class="pair__subject">${escapeHTML(subject)}</div>
      ${room ? `<div class="pair__room">${escapeHTML(room)}</div>` : ""}
      <div class="pair__teachers ${hasSecond ? "pair__teachers--split" : ""}">
        ${sub1}${hasSecond ? '<span class="pair__divider"></span>' : ""}${sub2}
      </div>
    </div>`;
}

const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>';

function emptyStateHTML(kind){
  if (kind === "weekend"){
    return `<div class="empty-state">${ICON_MOON}<div class="empty-state__title">Сьогодні вихідний</div><div class="empty-state__hint">Пар не заплановано</div></div>`;
  }
  return `<div class="empty-state">${ICON_CHECK}<div class="empty-state__title">На сьогодні пар більше немає</div><div class="empty-state__hint">Гарного відпочинку</div></div>`;
}

function dayCardInnerHTML(offset){
  const { dateMs, weekdayIdx, dayName, rows } = getDayInfo(offset);
  const isSunday = weekdayIdx === 0;

  let body;
  if (isSunday || rows.length === 0){
    body = emptyStateHTML(isSunday ? "weekend" : "no-data");
  } else {
    const list = rows.map(r => {
      const startMin = parseTimeToMinutes(r["Час початку"]);
      const endMin = parseTimeToMinutes(r["Час кінця"]);
      return pairHTML(r, computeStatus(offset, startMin, endMin));
    }).join("");

    let banner = "";
    if (offset === 0){
      const allPast = rows.every(r => {
        const endMin = parseTimeToMinutes(r["Час кінця"]);
        return endMin !== null && nowMinutes > endMin;
      });
      if (allPast) banner = `<div class="day-card__banner">На сьогодні пар більше немає</div>`;
    }
    body = banner + `<div class="pairs">${list}</div>`;
  }

  return `
    <div class="day-card__header">
      <span class="day-card__weekday">${escapeHTML(dayName)}</span>
      <span class="day-card__date">${escapeHTML(formatDateUA(dateMs))}</span>
    </div>
    ${body}`;
}

/* =========================================================================
   ГОЛОВНИЙ РЕНДЕР
   ========================================================================= */
function renderAll(){
  els.cardCenter.innerHTML = dayCardInnerHTML(baseOffset);
  els.cardPrev.innerHTML = dayCardInnerHTML(baseOffset - 1);
  els.cardNext.innerHTML = dayCardInnerHTML(baseOffset + 1);
}

function renderLoadingState(){
  els.cardCenter.innerHTML = `<div class="status-state"><div class="spinner"></div><div class="status-state__title">Завантажуємо розклад…</div></div>`;
  els.cardPrev.innerHTML = "";
  els.cardNext.innerHTML = "";
}

function renderErrorState(){
  els.cardCenter.innerHTML = `
    <div class="status-state">
      <div class="status-state__title">Не вдалося завантажити розклад</div>
      <div>Перевірте інтернет-з'єднання або спробуйте ще раз</div>
      <button class="retry-btn" id="retryBtn" type="button">Спробувати ще раз</button>
    </div>`;
  els.cardPrev.innerHTML = "";
  els.cardNext.innerHTML = "";
  document.getElementById("retryBtn").addEventListener("click", loadSchedule);
}

/* =========================================================================
   НАВІГАЦІЯ МІЖ ДНЯМИ (плавний перехід)
   ========================================================================= */
function navigate(direction){
  if (isAnimating || !scheduleRows.length) return;
  isAnimating = true;
  els.cards.classList.add(direction > 0 ? "is-leaving-next" : "is-leaving-prev");
  setTimeout(() => {
    baseOffset += direction;
    renderAll();
    els.cards.classList.remove("is-leaving-next", "is-leaving-prev");
    isAnimating = false;
  }, TRANSITION_MS);
}

els.btnPrev.addEventListener("click", () => navigate(-1));
els.btnNext.addEventListener("click", () => navigate(1));
els.cardPrev.addEventListener("click", () => navigate(-1));
els.cardNext.addEventListener("click", () => navigate(1));

/* ---- свайп на мобільних ---- */
let touchStartX = null;
els.cards.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].clientX; }, { passive:true });
els.cards.addEventListener("touchend", e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  touchStartX = null;
  if (Math.abs(dx) < SWIPE_THRESHOLD) return;
  navigate(dx < 0 ? 1 : -1);
});

/* ---- попапи з посиланням/приміткою: тап відкриває/закриває, клік поза — закриває ---- */
document.addEventListener("click", e => {
  const toggle = e.target.closest("[data-popup-toggle]");
  document.querySelectorAll(".teacher__icon.is-open").forEach(btn => {
    if (btn !== toggle) btn.classList.remove("is-open");
  });
  if (toggle){
    toggle.classList.toggle("is-open");
    e.stopPropagation();
  }
});

/* =========================================================================
   СТАРТ
   ========================================================================= */
loadSchedule();

})();
</script>
<script data-goatcounter="https://xswoo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
